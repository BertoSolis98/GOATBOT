; The two long-running parts of the container. Both restart if they stop.

[program:hermes]
; The first bot: a Hermes agent with its API server on 127.0.0.1:8642, working on screen :99.
command=hermes gateway run --no-supervise
environment=HOME="/root",HERMES_HOME="/root/.hermes",DISPLAY=":99",BH_HOME="/root/.hermes/browser-harness"
directory=/root
autorestart=true
startsecs=5
priority=10
stdout_logfile=/root/goatbot/logs/hermes.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:goatbot]
; The app on port 8787. It starts one more Hermes gateway per extra bot itself.
command=bash -c 'set -a; . /root/goatbot/runtime.env; exec node /opt/goatbot/server/dist/index.js'
directory=/opt/goatbot/server
environment=HOME="/root",COMPUTER="local",PORT="8787",HERMES_URL="http://127.0.0.1:8642",HERMES_HOME_PRIMARY="/root/.hermes",HERMES_BIN="hermes",DB_PATH="/root/goatbot/data/goatbot.db",ENGINES_DIR="/root/goatbot/engines",MCP_BASE_URL="http://127.0.0.1:8787"
autorestart=true
startsecs=5
priority=20
stdout_logfile=/root/goatbot/logs/goatbot.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
